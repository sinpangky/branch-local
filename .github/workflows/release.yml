name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and release (for example v1.5.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Validate version tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node scripts/release.mjs version
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Package (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-2022
            command: npm run dist:win
            executable: release/win-unpacked/BranchLocal.exe
          - platform: macos-arm64
            os: macos-15
            command: npm run dist:mac
            executable: release/mac-arm64/枝间.app/Contents/MacOS/枝间
          - platform: linux-x64
            os: ubuntu-22.04
            command: npm run dist:linux -- --config.rpm.compression=gzip
            executable: release/linux-unpacked/branch-local
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_BUILDER_COMPRESSION_LEVEL: '6'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install Linux packaging and desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools libnss3 libatk-bridge2.0-0 libgbm1 libasound2 xvfb gnome-keyring dbus-x11
      - run: npm ci --include=optional
      - run: npm test
      - name: Build packages
        run: ${{ matrix.command }}
      - name: Test packaged desktop
        if: runner.os != 'Linux'
        env:
          PACKAGED_EXECUTABLE: ${{ matrix.executable }}
        run: node scripts/desktop-smoke.mjs "${{ matrix.executable }}"
      - name: Test Linux packaged desktop with sandbox and keyring
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox
          dbus-run-session -- xvfb-run -a bash -euo pipefail -c '
            export GNOME_KEYRING_CONTROL
            eval "$(printf "ci-keyring-password" | gnome-keyring-daemon --unlock --components=secrets)"
            node scripts/desktop-smoke.mjs release/linux-unpacked/branch-local
          '
      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.platform }}
          path: |
            release/BranchLocal-*.exe
            release/BranchLocal-*.dmg
            release/BranchLocal-*.zip
            release/BranchLocal-*.AppImage
            release/BranchLocal-*.deb
            release/BranchLocal-*.rpm
            release/BranchLocal-*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload desktop test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-test-${{ matrix.platform }}
          path: artifacts/desktop-smoke.json
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          merge-multiple: true
          path: release
      - name: Verify all packages and generate checksums
        run: |
          node scripts/release.mjs verify
          npm run release:checksums
      - name: Upload draft and publish complete release
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            node -e 'if (!JSON.parse(require("fs").readFileSync("release-state.json", "utf8")).isDraft) throw new Error("Refusing to overwrite a published release")'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "枝间 · Branch Local $RELEASE_TAG" --generate-notes --notes-file .github/RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" release/BranchLocal-* release/SHA256SUMS-*.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false
